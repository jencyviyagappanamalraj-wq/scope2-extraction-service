AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scope 2 hello-world stack (Lambda + Function URL + DynamoDB + S3)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      # Provisioned capacity of 5 stays far inside the always-free 25 units
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256          # SSE-S3, free
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-test-files
            Status: Enabled
            ExpirationInDays: 1

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable
          BUCKET_NAME: !Ref FilesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  FunctionUrl:
    Value: !GetAtt HelloFunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref FilesBucket
  TableName:
    Value: !Ref JobsTable
